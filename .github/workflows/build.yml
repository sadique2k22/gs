name: Build Kernel (KSU-Next + SUSFS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git curl cpio lz4 flex bison bc \
            libssl-dev libelf-dev binutils-aarch64-linux-gnu \
            clang lld llvm

      - name: Clone kernel source (engstk/gs r245)
        run: |
          git clone https://github.com/engstk/gs.git kernel
          cd kernel
          git checkout r245

      - name: Apply KernelSU-Next (latest)
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash
          echo "CONFIG_KSU=y" >> arch/arm64/configs/gki_defconfig

      - name: Apply SUSFS patches
        run: |
          cd kernel
          git clone --depth=1 -b gki-android14-6.1 \
            https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs

          cp /tmp/susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch .
          cp /tmp/susfs/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch .
          cp /tmp/susfs/kernel_patches/fs/susfs.c fs/
          cp /tmp/susfs/kernel_patches/include/linux/susfs.h include/linux/
          cp /tmp/susfs/kernel_patches/include/linux/susfs_def.h include/linux/

          patch -p1 < 10_enable_susfs_for_ksu.patch || echo "[!] KSU SUSFS patch had rejects -- may need manual fix"
          patch -p1 < 50_add_susfs_in_gki-android14-6.1.patch || echo "[!] SUSFS kernel patch had rejects -- may need manual fix"

          echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/gki_defconfig

      - name: Build kernel
        run: |
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          make O=out LLVM=1 gki_defconfig
          make O=out LLVM=1 -j$(nproc)

          grep -q "CONFIG_KSU=y" out/.config && echo "[+] KSU enabled"
          grep -q "CONFIG_KSU_SUSFS=y" out/.config && echo "[+] SUSFS enabled"

          # Kernel lz4 uses legacy format (-l flag), no frame header
          lz4 -c -l -12 out/arch/arm64/boot/Image > out/Image.lz4
          ls -lh out/Image.lz4

      - name: Package as AnyKernel3 zip
        run: |
          # Grab the AK3 template from r245 release
          curl -sL "https://github.com/engstk/gs/releases/download/r245/blu_spark_r245-gs-susfs_a05e531.zip" -o /tmp/ak3.zip
          mkdir ak3
          unzip -o /tmp/ak3.zip -d ak3/

          # Replace kernel image
          rm -f ak3/Image.lz4
          cp kernel/out/Image.lz4 ak3/Image.lz4

          # Re-pack
          cd ak3
          zip -r ../blu_spark_r245-ksunext3-susfs.zip .
          cd ..
          ls -lh blu_spark_r245-ksunext3-susfs.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: blu_spark_r245-ksunext-susfs
          path: blu_spark_r245-ksunext3-susfs.zip
